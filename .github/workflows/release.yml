name: Release

# Wird ausgelöst, sobald eine Version veröffentlicht bzw. ein Tag "v..." angelegt wird
# (GitHub: Releases -> "Create a new release" -> Tag z. B. v0.5.0). Baut Programm + Installer und hängt sie an.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer für einen manuellen Testbau (nur Zahlen, z. B. 0.0.1)"
        required: true
        default: "0.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION_INPUT: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Version bestimmen
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" } else { $v = "$env:VERSION_INPUT" }
          $v = $v.Trim().TrimStart('v', 'V')
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { throw "Ungültige Versionsnummer: $v" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tesseract installieren (wird ins Programm gepackt)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $dir = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$dir\tesseract.exe")) { throw "Tesseract wurde nicht gefunden ($dir)" }
          & "$dir\tesseract.exe" --version

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build-Angaben schreiben
        run: python tools/write_build_info.py "$env:VERSION" "${{ github.repository }}" "${{ vars.RPC_CLIENT_ID }}"

      - name: Programm bauen (PyInstaller)
        run: python build_exe.py --no-zip

      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress

      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" "installer\AnimeAstralMonitor.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer-Bau fehlgeschlagen" }

      - name: Prüfsumme erzeugen
        shell: pwsh
        run: |
          $f = Get-ChildItem dist\AnimeAstralMonitor-Setup-*.exe | Select-Object -First 1
          if (-not $f) { throw "Installer nicht gefunden" }
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
          "$h  $($f.Name)" | Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          name: Anime Astral Monitor ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/AnimeAstralMonitor-Setup-*.exe
            dist/SHA256SUMS.txt
