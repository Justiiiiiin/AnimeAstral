name: Release

# Wird ausgelöst, sobald eine Version veröffentlicht bzw. ein Tag "v..." angelegt wird
# (GitHub: Releases -> "Create a new release" -> Tag z. B. v0.5.0). Baut Programm + Installer und hängt sie an.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer für einen manuellen Testbau (nur Zahlen, z. B. 0.0.1)"
        required: true
        default: "0.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VERSION_INPUT: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Version bestimmen
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" } else { $v = "$env:VERSION_INPUT" }
          $v = $v.Trim().TrimStart('v', 'V')
          if ($v -notmatch '^\d+(\.\d+){1,3}$') { throw "Ungültige Versionsnummer: $v" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $v"

      - name: Pakete installieren
        run: python -m pip install -r requirements-build.txt     # feste Versionen = kleine Update-Pakete

      - name: Tesseract installieren (wird ins Programm gepackt)
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          $dir = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$dir\tesseract.exe")) { throw "Tesseract wurde nicht gefunden ($dir)" }
          & "$dir\tesseract.exe" --version

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Build-Angaben schreiben
        run: python tools/write_build_info.py "$env:VERSION" "${{ github.repository }}"     # keine persönlichen IDs im Build

      - name: Programm bauen (PyInstaller)
        run: python build_exe.py --no-zip

      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress

      - name: Installer bauen
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=$env:VERSION" "installer\AnimeAstralMonitor.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer-Bau fehlgeschlagen" }

      - name: Update-Paket (nur geänderte Dateien seit der vorigen Version)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force prev | Out-Null
          # neueste bisherige Veröffentlichung (dieser Release existiert erst nach dem letzten Schritt)
          gh release download --repo "${{ github.repository }}" --pattern "files-*.json" --dir prev 2>$null
          $prev = Get-ChildItem prev\files-*.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($prev) { python tools/make_patch.py "$env:VERSION" dist\AnimeAstralMonitor dist $prev.FullName }
          else { python tools/make_patch.py "$env:VERSION" dist\AnimeAstralMonitor dist }
          if ($LASTEXITCODE -ne 0) { throw "Update-Paket fehlgeschlagen" }

      - name: Prüfsummen erzeugen
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist\AnimeAstralMonitor-Setup-*.exe, dist\AnimeAstralMonitor-Update-*.zip, dist\files-*.json -ErrorAction SilentlyContinue)
          if (-not ($files | Where-Object Name -like 'AnimeAstralMonitor-Setup-*')) { throw "Installer nicht gefunden" }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File -FilePath dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Veröffentlichen
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', env.VERSION) }}
          name: Anime Astral Monitor ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/AnimeAstralMonitor-Setup-*.exe
            dist/AnimeAstralMonitor-Update-*.zip
            dist/files-*.json
            dist/SHA256SUMS.txt
